<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تدشين منصة عيون للقدرات</title>
<style>
:root{--a1:#f2c85b;--a2:#c8902a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;text-align:center;color:#f5efe0;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 50% 20%,#4a3416,#0a0810 70%);padding:24px;overflow:hidden}
.chip{display:inline-block;border:1px solid rgba(242,200,91,.4);border-radius:99px;padding:6px 18px;color:var(--a1);background:rgba(242,200,91,.08)}
h1{font-size:2.3rem;margin:18px 0 8px;line-height:1.3}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a1),#f08c5a);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#b9b09c;margin:0 0 30px}
a.go{display:inline-block;padding:18px 44px;border-radius:99px;font-size:1.3rem;font-weight:800;text-decoration:none;color:#1b1304;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 40px -6px var(--a1);animation:pl 2s infinite}
@keyframes pl{50%{transform:scale(1.05)}}
i.cf{position:fixed;top:-20px;width:8px;height:14px;border-radius:2px;animation:fl linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div>
<span class="chip">🚀 انطلاقة جديدة</span>
<h1>تدشين منصة <em>عيون للقدرات</em></h1>
<p>اختبار تجريبي، تدريب موجّه، ومتابعة لتطور مستواك</p>
<a class="go" id="go" href="#">ادخل المنصة ←</a>
</div>
<script>
/* غيّر الرابط هنا لو تغيّر عنوان المنصة */
var URL_PLATFORM='https://quiztest2.github.io/';
document.getElementById('go').href=URL_PLATFORM;
var c=['#f2c85b','#c8902a','#f08c5a','#fff3c4'];
for(var k=0;k<40;k++){var e=document.createElement('i');e.className='cf';e.style.cssText='left:'+Math.random()*100+'vw;background:'+c[k%4]+';animation-duration:'+(3+Math.random()*3)+'s;animation-delay:'+Math.random()*1.5+'s';document.body.appendChild(e)}
</script>
</body>
</html>
